# CorpErgo Wellness UI — Render Static Site
# Build Command: npm install && npm run build
# Publish Directory: dist   (build also works — both are generated)
# Redirects/Rewrites: /* → /index.html (Rewrite) — required so refresh does not 404
services:
  - type: web
    name: corpergo-wellness-ui
    runtime: static
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)"
      - path: /*
        name: Content-Security-Policy-Report-Only
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-src 'self' https://www.instagram.com; img-src 'self' data: blob: https:; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://www.clarity.ms; connect-src 'self' https://gnmahvpujdthvthsypaj.supabase.co wss://gnmahvpujdthvthsypaj.supabase.co https://www.google-analytics.com https://*.clarity.ms; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
      - path: /*
        name: Feature-Policy
        value: "camera 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sitemap.xml
        name: Cache-Control
        value: no-cache
      - path: /image-sitemap.xml
        name: Cache-Control
        value: no-cache
      - path: /robots.txt
        name: Cache-Control
        value: no-cache
      - path: /site.webmanifest
        name: Cache-Control
        value: public, max-age=86400
      - path: /og-image.png
        name: Cache-Control
        value: public, max-age=604800
