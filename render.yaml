# CorpErgo Wellness UI — Render Static Site
# Build Command: npm install && npm run build
# Publish Directory: dist
# Redirects/Rewrites: /* → /index.html (Rewrite) — required so refresh does not 404
services:
  - type: web
    name: corpergo-wellness-ui
    runtime: static
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # Allow getUserMedia on HTTPS (camera works on localhost without this; production needs it explicit if restricted)
      - path: /*
        name: Permissions-Policy
        value: "camera=(self), microphone=(), geolocation=()"
      - path: /*
        name: Feature-Policy
        value: "camera 'self'"
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /login/*
        name: Cache-Control
        value: no-cache
      - path: /physio/*
        name: Cache-Control
        value: no-cache
